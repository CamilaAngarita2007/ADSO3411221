<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>CLUB ACERIAS</title>
    <link rel="stylesheet" href="../Assets/css/estilos.css">
</head>

<body>

    <div>

        <form id="formLogin" action="../Modelo/iniciarSesion.php" method="POST">
            <legend>INICIAR SESION</legend>

            <div class="mb-3">
                <label for="email" class="form-label fw-semibold text-secondary">Correo Electrónico:</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="nombre@correo.com"
                    required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-semibold text-secondary">Contraseña:</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="****" required>
            </div>

            <div class="ingresar d-grid gap-2">
                <button type="submit" class="btn btn-primary fw-bold py-2">Iniciar Sesión</button>
            </div>

                <div class="crear-cuenta">
                    <p>No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
                </div>

        </form>

    </div>

</body>

<script src="../Controlador/login.js">  </script>

</html>
