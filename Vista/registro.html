<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>CLUB ACERIAS</title>
    <link rel="stylesheet" href="../Assets/css/estilos.css">
</head>

<body>

    <div>
        <div class='formulario'>

            <form id="FormRegistro" action="" method="post">
                <legend>Registro de asociados - Acerias</legend>

                <div class="grupo-input">
                    <label>Ingresar Documento:</label>
                    <input type="number" id="documento" required placeholder="ejemplo:1119150888">
                </div>

                <div class="grupo-input">
                    <label>Ingresar el Nombre:</label>
                    <input type="text" id="nombre" required placeholder="ejemplo:Camila Andrea">
                </div>

                <div class="grupo-input">
                    <label>Ingresar el Apellido:</label>
                    <input type="text" id="apellido" required placeholder="ejemplo:Angarita Soto">
                </div>

                <div class="grupo-input">
                    <label>Ingresar la Fecha de Nacimiento:</label>
                    <input type="date" id="fechaNacimiento" required placeholder="ejemplo:23/06/2007">
                </div>

                <div class="grupo-input">
                    <label>Ingresar el Genero:</label>
                    <div class="genero">
                        <label>
                            <input type="radio" id="Masculino" name="genero" value="Masculino">
                            <span>Masculino</span>
                        </label>
                        <label>
                            <input type="radio" id="Femenino" name="genero" value="F">
                            <span>Femenino</span>
                        </label>
                        <label>
                            <input type="radio" id="otro" name="genero" value="otro">
                            <span>Otro</span>
                        </label>
                    </div>
                </div>

                <div class="grupo-input">
                    <label>Ingresar la Direccion:</label>
                    <input type="text" id="direccionResidencia" required placeholder="ejemplo: cra 13 #3-21">
                </div>

                <div class="grupo-input">
                    <label>Ingresar la Ciudad:</label>
                    <select name="Ciudad" id="ciudad" required>
                        <option value="sogamoso">Sogamoso</option>
                        <option value="duitama">Duitama</option>
                        <option value="tunja">Tunja</option>
                        <option value="nobsa">Nobsa</option>
                        <option value="cerinza">Cerinza</option>
                    </select>
                </div>

                <div class="grupo-input">
                    <label>Ingresar el Telefono:</label>
                    <input type="tel" id="telefono" required placeholder="ejemplo: 3112607209">
                </div>

                <div class="grupo-input">
                    <label>Ingresar el Email:</label>
                    <input type="email" id="email" required placeholder="ejemplo: camilayricardo2014@gmail.com">
                </div>

                <div class="grupo-botones">
                    <button type="submit">Guardar</button>
                    <button type="reset">Limpiar</button>
                </div>

                <div class="iniciar-sesion">
                    <p>Ya tienes una cuenta? <a href="login.html">Iniciar sesion</a></p>
                </div>
            </form>
        </div>

    </div>

</body>

</html>
