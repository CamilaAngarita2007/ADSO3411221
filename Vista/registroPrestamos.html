<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Assets/css/registro.css">
    <title>CLUB ACERIAS - Solicitud de préstamo</title>
</head>

<body>
    <div class="header-mr d-flex flex-wrap gap-2 justify-content-between align-items-center p-3 shadow-sm">
        <h3>CLUB ACERIAS</h3>
        <div class="text-end">
            <small id="nombreUsuario"></small>
            <a href="Prestamos.html" class="btn btn-light btn-sm"><i class="bi bi-arrow-left"></i> Volver a préstamos</a>
            <button id="cerrarSesion" class="btn btn-danger btn-sm"><i class="bi-box-arrow-right"></i> Cerrar sesión</button>
        </div>
    </div>

    <div class="container py-4">
        <form id="formPrestamos" action="" method="post">
            <fieldset>
                <legend><i class="bi bi-bank"></i> Solicitud de préstamo - Acerias</legend>

                <div class="campos row g-3 mx-0">
                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="valorPrestamo">Ingresar el Valor del Préstamo:</label>
                            <input type="number" id="valorPrestamo" name="valorPrestamo" min="1" required placeholder="ejemplo: 2000000">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="plazoMeses">Ingresar el Plazo en Meses:</label>
                            <input type="number" id="plazoMeses" name="plazoMeses" min="1" required placeholder="ejemplo: 12">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="fechaSolicitud">Ingresar la Fecha de Solicitud:</label>
                            <input type="date" id="fechaSolicitud" name="fechaSolicitud" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label>Tasa de interés mensual:</label>
                            <p class="mb-0 fw-bold">1,5 % (fija)</p>
                        </div>
                    </div>
                </div>

                <div class="grupo-botones">
                    <button type="submit">Solicitar</button>
                    <button type="reset">Limpiar</button>
                </div>
            </fieldset>
        </form>
    </div>
    <script src="../Controlador/sesion.js"></script>
    <script src="../Controlador/registroPrestamos.js"></script>
</body>

</html>
