<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Assets/css/registro.css">
    <title>CLUB ACERIAS - Registro de abono</title>
</head>

<body>
    <div class="header-mr d-flex flex-wrap gap-2 justify-content-between align-items-center p-3 shadow-sm">
        <h3>CLUB ACERIAS</h3>
        <div class="text-end">
            <small id="nombreUsuario"></small>
            <a href="pagos.html" class="btn btn-light btn-sm"><i class="bi bi-arrow-left"></i> Volver a pagos</a>
            <button id="cerrarSesion" class="btn btn-danger btn-sm"><i class="bi-box-arrow-right"></i> Cerrar sesión</button>
        </div>
    </div>

    <div class="container py-4">
        <form id="formPago" action="" method="post">
            <fieldset>
                <legend><i class="bi bi-cash-coin"></i> Registro de abono - Acerias</legend>

                <div class="campos row g-3 mx-0">
                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label>Deuda actual del préstamo:</label>
                            <p class="mb-0 fw-bold text-danger" id="deudaActual">-</p>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="valorAbono">Ingresar la cantidad a abonar:</label>
                            <input type="number" id="valorAbono" name="valorCuota" min="1" step="any" required placeholder="ejemplo: 150000">
                        </div>
                    </div>
                </div>

                <div class="grupo-botones">
                    <button type="submit" id="botonAbonar">Abonar</button>
                    <button type="reset">Limpiar</button>
                </div>
            </fieldset>
        </form>
    </div>
    <script src="../Controlador/sesion.js"></script>
    <script src="../Controlador/registroPago.js"></script>
</body>

</html>
