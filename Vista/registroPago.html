<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Assets/css/registro.css">
    <title>CLUB ACERIAS - Registro de pago</title>
</head>

<body>
    <div class="header-mr d-flex flex-wrap gap-2 justify-content-between align-items-center p-3 shadow-sm">
        <h3>CLUB ACERIAS</h3>
        <a href="dashboard.html" class="btn btn-light btn-sm"><i class="bi bi-arrow-left"></i> Volver al panel</a>
    </div>

    <div class="container py-4">
        <form id="formPago" action="" method="post">
            <fieldset>
                <legend><i class="bi bi-cash-coin"></i> Registro de pago - Acerias</legend>

                <div class="campos row g-3 mx-0">
                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="documentoAsociado">Ingresar el Documento del Asociado:</label>
                            <input type="number" id="documentoAsociado" name="documentoAsociado" required placeholder="ejemplo: 1119150888">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="nombreAsociado">Ingresar el Nombre del Asociado:</label>
                            <input type="text" id="nombreAsociado" name="nombreAsociado" required placeholder="ejemplo: Camila Angarita">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="conceptoPago">Ingresar el Concepto del Pago:</label>
                            <select id="conceptoPago" name="conceptoPago" required>
                                <option value="" selected disabled>Seleccionar...</option>
                                <option value="cuota asociado">Cuota de asociado</option>
                                <option value="cuota prestamo">Cuota de préstamo</option>
                                <option value="adelanto cuotas">Adelanto de cuotas</option>
                                <option value="actividad">Actividad</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="fechaPago">Ingresar la Fecha del Pago:</label>
                            <input type="date" id="fechaPago" name="fechaPago" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="valorPago">Ingresar el Valor del Pago:</label>
                            <input type="number" id="valorPago" name="valorPago" min="1" required placeholder="ejemplo: 150000">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="numeroComprobante">Ingresar el Número de Comprobante:</label>
                            <input type="text" id="numeroComprobante" name="numeroComprobante" placeholder="ejemplo: 000123">
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="grupo-input" role="radiogroup" aria-labelledby="tituloMedioPago">
                            <span id="tituloMedioPago" class="titulo-opciones">Ingresar el Medio de Pago:</span>
                            <div class="opciones">
                                <label>
                                    <input type="radio" name="medioPago" value="efectivo" required>
                                    <span>Efectivo</span>
                                </label>
                                <label>
                                    <input type="radio" name="medioPago" value="transferencia">
                                    <span>Transferencia</span>
                                </label>
                                <label>
                                    <input type="radio" name="medioPago" value="consignacion">
                                    <span>Consignación</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="grupo-input">
                            <label for="observaciones">Ingresar las Observaciones:</label>
                            <textarea id="observaciones" name="observaciones" placeholder="ejemplo: Pago de la cuota del mes de noviembre"></textarea>
                        </div>
                    </div>
                </div>

                <div class="grupo-botones">
                    <button type="submit">Guardar</button>
                    <button type="reset">Limpiar</button>
                </div>
            </fieldset>
        </form>
    </div>
</body>

</html>
