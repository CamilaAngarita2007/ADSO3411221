<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Actividades | Club Acerías</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../Assets/css/crud.css" rel="stylesheet">
  <style>
    .header-mr { background-color: #770065; color: #ffffff; padding: 20px 30px; }
    .header-mr h3 { margin: 0; }
  </style>
</head>
<body class="registration-body">
  <div class="header-mr d-flex flex-wrap gap-2 justify-content-between align-items-center p-3 shadow-sm">
    <h3>CLUB ACERIAS - Actividades</h3>
    <div class="text-end">
      <small id="nombreUsuario"></small>
      <button id="cerrarSesion" class="btn btn-danger btn-sm mt-1"><i class="bi-box-arrow-right"></i> Cerrar sesión</button>
    </div>
  </div>

  <main class="container page-content">
    <div class="page-heading d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3">
      <div>
        <a class="back-link" href="dashboard.html"><i class="bi bi-arrow-left me-1"></i>Volver al panel</a>
        <span class="eyebrow d-block mt-4">MÓDULO DE ACTIVIDADES</span>
        <h1 class="h2 fw-bold mt-2">Actividades del club</h1>
        <p class="text-secondary mb-0">Consulta las actividades programadas y su total recaudado.</p>
      </div>
      <a class="btn btn-primary px-4" href="registroActividades.html"><i class="bi bi-plus-circle me-2"></i>Nueva actividad</a>
    </div>

    <section class="card form-card mt-4">
      <div class="card-body p-4">
        <div id="cargandoActividades" class="text-center py-5 text-secondary">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="mt-3 mb-0">Cargando actividades...</p>
        </div>

        <div class="table-responsive d-none" id="contenedorTabla">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th scope="col">Actividad</th>
                <th scope="col">Fecha</th>
                <th scope="col">Municipio</th>
                <th scope="col">Total recaudado</th>
                <th scope="col" class="text-end d-none" id="thAcciones">Acciones</th>
              </tr>
            </thead>
            <tbody id="listaActividades"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer"><div class="container py-4 text-center text-secondary small">Club Acerías · Sistema de gestión</div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../Controlador/sesion.js"></script>
  <script src="../Controlador/Actividades.js"></script>
</body>
</html>
