<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Assets/css/registro.css">
    <link rel="stylesheet" href="../Assets/css/crud.css">
    <title>CLUB ACERIAS - Registro de actividades</title>
</head>

<body class="registration-body">
    <div class="header-mr d-flex flex-wrap gap-2 justify-content-between align-items-center p-3 shadow-sm">
        <h3>CLUB ACERIAS</h3>
        <div class="text-end">
            <small id="nombreUsuario">nombreUsuario</small>
            <button id="cerrarSesion" class="btn btn-danger btn-sm"><i class="bi-box-arrow-right"></i> Cerrar sesión</button>
        </div>
    </div>

    <main class="container page-content">
        <a class="back-link d-inline-block mb-3" href="Actividades.html"><i class="bi bi-arrow-left me-1"></i>Volver a actividades</a>
        <form id="formActividades" action="" method="post">
            <fieldset>
                <legend><i class="bi bi-clipboard-check"></i> Registro de actividades - Acerias</legend>

                <div class="campos row g-3 mx-0">
                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="nombreActividad">Ingresar el Nombre de la Actividad:</label>
                            <input type="text" id="nombreActividad" name="nombreActividad" required placeholder="ejemplo: Torneo de microfútbol">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="tipoActividad">Ingresar el Tipo de Actividad:</label>
                            <select id="tipoActividad" name="tipoActividad" required>
                                <option value="" selected disabled>Seleccionar...</option>
                                <option value="deportiva">Deportiva</option>
                                <option value="cultural">Cultural</option>
                                <option value="recreativa">Recreativa</option>
                                <option value="social">Social</option>
                                <option value="capacitacion">Capacitación</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="fechaActividad">Ingresar la Fecha:</label>
                            <input type="date" id="fechaActividad" name="fechaActividad" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="lugarActividad">Ingresar el Lugar:</label>
                            <input type="text" id="lugarActividad" name="lugarActividad" required placeholder="ejemplo: Sede social del club">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="horaInicio">Ingresar la Hora de Inicio:</label>
                            <input type="time" id="horaInicio" name="horaInicio" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="horaFin">Ingresar la Hora de Finalización:</label>
                            <input type="time" id="horaFin" name="horaFin" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="responsable">Ingresar el Responsable:</label>
                            <input type="text" id="responsable" name="responsable" required placeholder="ejemplo: Camila Angarita">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="cupos">Ingresar los Cupos Disponibles:</label>
                            <input type="number" id="cupos" name="cupos" min="1" required placeholder="ejemplo: 30">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="valorActividad">Ingresar el Valor por Asociado:</label>
                            <input type="number" id="valorActividad" name="valorActividad" min="0" required placeholder="ejemplo: 20000">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="estadoActividad">Ingresar el Estado:</label>
                            <select id="estadoActividad" name="estadoActividad" required>
                                <option value="" selected disabled>Seleccionar...</option>
                                <option value="programada">Programada</option>
                                <option value="en curso">En curso</option>
                                <option value="finalizada">Finalizada</option>
                                <option value="cancelada">Cancelada</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="grupo-input">
                            <label for="descripcion">Ingresar la Descripción:</label>
                            <textarea id="descripcion" name="descripcion" placeholder="ejemplo: Torneo interno entre los asociados del club"></textarea>
                        </div>
                    </div>
                </div>

                <div class="grupo-botones">
                    <button type="submit">Guardar</button>
                    <button type="reset">Limpiar</button>
                </div>
            </fieldset>
        </form>
    </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Controlador/sesion.js"></script>
</body>

</html>
