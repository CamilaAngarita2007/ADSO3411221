<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Assets/css/registro.css">
    <title>CLUB ACERIAS - Registro de reportes</title>
</head>

<body>
    <div class="header-mr d-flex flex-wrap gap-2 justify-content-between align-items-center p-3 shadow-sm">
        <h3>CLUB ACERIAS</h3>
        <a href="dashboard.html" class="btn btn-light btn-sm"><i class="bi bi-arrow-left"></i> Volver al panel</a>
    </div>

    <div class="container py-4">
        <form id="formReportes" action="" method="post">
            <fieldset>
                <legend><i class="bi bi-envelope-plus"></i> Registro de reportes - Acerias</legend>

                <div class="campos row g-3 mx-0">
                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="tituloReporte">Ingresar el Título del Reporte:</label>
                            <input type="text" id="tituloReporte" name="tituloReporte" required placeholder="ejemplo: Balance de noviembre">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="tipoReporte">Ingresar el Tipo de Reporte:</label>
                            <select id="tipoReporte" name="tipoReporte" required>
                                <option value="" selected disabled>Seleccionar...</option>
                                <option value="financiero">Financiero</option>
                                <option value="actividades">Actividades</option>
                                <option value="asociados">Asociados</option>
                                <option value="prestamos">Préstamos</option>
                                <option value="pagos">Pagos</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="fechaInicio">Ingresar la Fecha de Inicio:</label>
                            <input type="date" id="fechaInicio" name="fechaInicio" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="fechaFin">Ingresar la Fecha de Fin:</label>
                            <input type="date" id="fechaFin" name="fechaFin" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="documentoAsociado">Ingresar el Documento del Asociado:</label>
                            <input type="number" id="documentoAsociado" name="documentoAsociado" placeholder="ejemplo: 1119150888">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="responsable">Ingresar el Responsable:</label>
                            <input type="text" id="responsable" name="responsable" required placeholder="ejemplo: Camila Angarita">
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="grupo-input" role="radiogroup" aria-labelledby="tituloFormato">
                            <span id="tituloFormato" class="titulo-opciones">Ingresar el Formato:</span>
                            <div class="opciones">
                                <label>
                                    <input type="radio" name="formatoReporte" value="pdf" required>
                                    <span>PDF</span>
                                </label>
                                <label>
                                    <input type="radio" name="formatoReporte" value="excel">
                                    <span>Excel</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="grupo-input">
                            <label for="descripcion">Ingresar la Descripción:</label>
                            <textarea id="descripcion" name="descripcion" placeholder="ejemplo: Ingresos y egresos del club durante el mes"></textarea>
                        </div>
                    </div>
                </div>

                <div class="grupo-botones">
                    <button type="submit">Guardar</button>
                    <button type="reset">Limpiar</button>
                </div>
            </fieldset>
        </form>
    </div>
</body>

</html>
